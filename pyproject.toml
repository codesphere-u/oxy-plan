[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "oxy-plan"
version = "0.1.0"
description = "Zero-dependency WHO medical oxygen infrastructure planner: ward-level L/min demand, PSA plant Nm3/hr & J-cylinder backup manifold sizing, power/generator sizing, and 10-year PSA vs cylinder USD/Nm3 comparator."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "medical-oxygen",
    "psa-plant",
    "hospital-engineering",
    "who",
    "public-health",
    "biomedical",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
oxy-plan = "oxy_plan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oxy_plan"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
